name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  check:
    name: Typecheck and tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # `npm ci` installs exactly what the lockfile pins and fails if the
      # lockfile and package.json disagree, which is what you want in CI.
      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Tests
        run: npm test

      # The move generator is the part worth proving, and perft either matches
      # the published node counts or it does not, so a green build here is a
      # real statement about correctness rather than a smoke test.
      - name: Production build
        run: npm run build
